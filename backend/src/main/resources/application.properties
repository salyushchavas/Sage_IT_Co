spring.application.name=sage-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/spire_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:spire_user}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${DDL_MODE:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

jwt.secret=${JWT_SECRET:defaultSecretKeyThatShouldBeChangedInProduction0123456789}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}

# CORS allowed origins (comma-separated). Prod values come from
# CORS_ALLOWED_ORIGINS on Railway -- e.g.
# https://sageitco.com,https://www.sageitco.com,https://*.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# === AWS S3 (Phase 1 document storage) ===
# Region + bucket are sourced from the environment (never hardcoded).
# Credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY) are read by the
# AWS SDK's DefaultCredentialsProvider straight from the environment, so
# they are intentionally NOT mapped to a Spring property here.
aws.region=${AWS_REGION:}
aws.s3.bucket=${S3_BUCKET:}

# === Email (SMTP -- Gmail direct) ===
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_EMAIL:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.url=${APP_URL:https://sageitco.com}

agreement.cron.secret=${AGREEMENT_CRON_SECRET:}

# Agreement ERM (hidden consultant-agreement console). The single
# operator account is hardcoded via these env vars rather than
# stored in users -- this surface is intentionally separate from
# the Sage ERM dashboard.
agreement-erm.email=${AGREEMENT_ERM_EMAIL:ermuser@sageitco.com}
agreement-erm.password=${AGREEMENT_ERM_PASSWORD:SageAgree@2026}

# Multi-user agreement console: the single SUPER_ADMIN is bootstrapped
# from these env vars by DataSeeder.ensureSuperAdmin (idempotent, never
# creatable through the UI). Login authenticates against the
# agreement_user table; the AGREEMENT_ERM_* vars above are kept ONLY for
# the PDF placeholder / notification recipient and are no longer login
# credentials. Blank defaults => bootstrap is skipped on local dev.
agreement.super-admin.email=${AGREEMENT_SUPER_ADMIN_EMAIL:}
agreement.super-admin.password=${AGREEMENT_SUPER_ADMIN_PASSWORD:}
agreement.super-admin.name=${AGREEMENT_SUPER_ADMIN_NAME:}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

spring.jackson.time-zone=Asia/Kolkata

logging.level.com.spire.backend.security=INFO

# ── Brand configuration ──────────────────────────────────────────
# Defaults match the Sage IT Co deployment. Override any of these on
# Railway (BRAND_* env vars) for a different brand.
brand.name=${BRAND_NAME:Sage IT Co}
brand.short-name=${BRAND_SHORT_NAME:Sage}
brand.legal-name=${BRAND_LEGAL_NAME:Sage IT Co}
brand.tagline=${BRAND_TAGLINE:IT Consulting and Career Development}
brand.contact-email=${BRAND_CONTACT_EMAIL:info@sageitco.com}
brand.support-email=${BRAND_SUPPORT_EMAIL:support@sageitco.com}
brand.noreply-email=${BRAND_NOREPLY_EMAIL:noreply@sageitco.com}
brand.address-line1=${BRAND_ADDRESS_LINE1:}
brand.address-line2=${BRAND_ADDRESS_LINE2:}
brand.city=${BRAND_CITY:}
brand.state=${BRAND_STATE:}
brand.postal-code=${BRAND_POSTAL_CODE:}
brand.country=${BRAND_COUNTRY:India}
brand.website=${BRAND_WEBSITE:https://sageitco.com}
brand.id-prefix=${BRAND_ID_PREFIX:SAGE}
brand.primary-color=${BRAND_PRIMARY_COLOR:#1B2A5C}
brand.primary-color-dark=${BRAND_PRIMARY_COLOR_DARK:#0F1F44}
brand.letterhead-path=${BRAND_LETTERHEAD_PATH:sage_letterhead.pdf}
brand.logo-url=${BRAND_LOGO_URL:https://sageitco.com/sage_logo.png}