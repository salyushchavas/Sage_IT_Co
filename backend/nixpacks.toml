# Railway uses nixpacks to build this service (see railway.toml).
# We need LibreOffice on the runtime image so the
# AgreementDocumentService can shell out to `libreoffice --headless
# --convert-to pdf` after the docx-stamper template fill.
#
# nixpacks installs nixPkgs at build time and aptPkgs at runtime.
# Putting libreoffice + a font package in aptPkgs ensures both
# the binary and its required Liberation fonts are present when
# the Java service spawns the conversion process.

[phases.setup]
aptPkgs = [
    "libreoffice-writer",
    "libreoffice-core",
    "fonts-liberation",
    "fontconfig",
    # Build AQ — heif-convert, for HEIC → JPEG on document previews.
    # iPhones shoot HEIC by default, so a consultant photographing a
    # cheque uploads one; no browser can decode it, so "view cheque"
    # served a file the ERM could only download and still not open.
    # Ships /usr/bin/heif-convert and pulls in libheif itself.
    # Without this package the transcode is skipped and the raw HEIC is
    # served — i.e. exactly the broken behaviour, so keep it installed.
    "libheif-examples",
    # tini — a minimal init that runs as PID 1 and reaps orphaned children.
    # Without it the JVM is PID 1, and a JVM (unlike a real init) never reaps
    # grandchildren that reparent to it. Any soffice.bin outliving its
    # launcher then becomes a permanent zombie holding a PID, until the
    # container's PID ceiling is exhausted and every request fails with
    # "pthread_create failed (EAGAIN)". See railway.toml's startCommand.
    "tini",
]
